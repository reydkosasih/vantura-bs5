<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Modern Bootstrap 5 Admin Panel</title>
  <!-- Early Theme Detection Script (Prevents FOUT / Theme Flicker) -->
  <script>
    (function () {
      const storedTheme = localStorage.getItem('admin-template-theme');
      const resolvedTheme = (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) || (storedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
    })();
  </script>
  <!-- Google Fonts (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Admin CSS -->
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>
  <!-- Floating Theme Switcher at Top Right -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
    <div class="dropdown">
      <button class="btn btn-outline-secondary btn-icon shadow-sm" id="bd-theme" type="button" data-bs-toggle="dropdown"
        aria-expanded="false" aria-label="Toggle theme">
        <i class="bi bi-circle-half theme-icon-active"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light"><i
              class="bi bi-sun-fill me-2 opacity-75"></i> Light</button></li>
        <li><button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark"><i
              class="bi bi-moon-stars-fill me-2 opacity-75"></i> Dark</button></li>
        <li><button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto"><i
              class="bi bi-circle-half me-2 opacity-75"></i> Auto</button></li>
      </ul>
    </div>
  </div>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-body p-4 p-sm-5">
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-body mb-2">
            <i class="bi bi-cpu-fill text-primary fs-2"></i>
            <span class="fs-4 fw-bold">Vantura BS5</span>
          </a>
          <h5 class="fw-bold mb-1">Forgot Password?</h5>
          <p class="text-secondary small">
            Enter your account email address below and we'll send a password recovery reset link.
          </p>
        </div>

        <!-- Forgot Form -->
        <form action="auth-login.html" method="GET">
          <div class="mb-4">
            <label for="resetEmail" class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="resetEmail" placeholder="name@company.io" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Send Reset Instructions
          </button>
        </form>

        <!-- Back to Login -->
        <div class="text-center mt-4 pt-2">
          <a href="auth-login.html"
            class="small fw-semibold text-decoration-none d-inline-flex align-items-center gap-1">
            <i class="bi bi-arrow-left"></i> Back to Sign In
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS & Admin JS -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
