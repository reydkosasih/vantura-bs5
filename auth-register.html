<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Modern Bootstrap 5 Admin Panel</title>
  <!-- Early Theme Detection Script (Prevents FOUT / Theme Flicker) -->
  <script>
    (function () {
      const storedTheme = localStorage.getItem('admin-template-theme');
      const resolvedTheme = (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) || (storedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
    })();
  </script>
  <!-- Google Fonts (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Admin CSS -->
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>
  <!-- Floating Theme Switcher at Top Right -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
    <div class="dropdown">
      <button class="btn btn-outline-secondary btn-icon shadow-sm" id="bd-theme" type="button" data-bs-toggle="dropdown"
        aria-expanded="false" aria-label="Toggle theme">
        <i class="bi bi-circle-half theme-icon-active"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light"><i
              class="bi bi-sun-fill me-2 opacity-75"></i> Light</button></li>
        <li><button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark"><i
              class="bi bi-moon-stars-fill me-2 opacity-75"></i> Dark</button></li>
        <li><button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto"><i
              class="bi bi-circle-half me-2 opacity-75"></i> Auto</button></li>
      </ul>
    </div>
  </div>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-body p-4 p-sm-5">
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-body mb-2">
            <i class="bi bi-cpu-fill text-primary fs-2"></i>
            <span class="fs-4 fw-bold">Vantura BS5</span>
          </a>
          <h5 class="fw-bold mb-1">Create an account</h5>
          <p class="text-secondary small">Start managing your projects and infrastructure today.</p>
        </div>

        <!-- Sign Up Form -->
        <form action="index.html" method="GET">
          <div class="mb-3">
            <label for="regName" class="form-label small fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="regName" placeholder="e.g. Michael De Santa" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="regEmail" class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="regEmail" placeholder="name@company.io" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="regPassword" class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="regPassword" placeholder="Minimum 8 characters" required>
              <button class="btn btn-outline-secondary" type="button" id="toggleRegPass">
                <i class="bi bi-eye" id="toggleRegIcon"></i>
              </button>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label small text-secondary" for="termsCheck">
              I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> & <a href="#"
                class="text-decoration-none">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Create Account
          </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center mt-4 pt-2">
          <span class="text-secondary small">Already have an account?</span>
          <a href="auth-login.html" class="small fw-semibold text-decoration-none ms-1">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS & Admin JS -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>

  <script>
    const toggleBtn = document.getElementById('toggleRegPass');
    const passInput = document.getElementById('regPassword');
    const passIcon = document.getElementById('toggleRegIcon');

    if (toggleBtn && passInput && passIcon) {
      toggleBtn.addEventListener('click', () => {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
        passIcon.classList.toggle('bi-eye');
        passIcon.classList.toggle('bi-eye-slash');
      });
    }
  </script>
</body>

</html>
